# nginx site for blastemindustries.com and www.blastemindustries.com.
#
# Serves the static site from /var/www/blastemindustries.com. It answers only for the
# apex and www names, so other subdomains on the same server (sentinel., sams., ...)
# keep using their own server blocks untouched.
#
# setup-server.sh installs this as HTTP-only first; certbot then adds the HTTPS
# listener and the HTTP->HTTPS redirect to this same file.

server {
    listen 80;
    listen [::]:80;
    server_name blastemindustries.com www.blastemindustries.com;

    root /var/www/blastemindustries.com;
    index index.html;

    # One canonical host: www sends people to the bare domain.
    if ($host = www.blastemindustries.com) {
        return 301 $scheme://blastemindustries.com$request_uri;
    }

    # Pretty URLs: /sentinel and /zeronet resolve to the .html pages, and the
    # existing .html links (including the TrackWise policy URLs) keep working.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Fonts, images, CSS and JS can be cached hard; HTML is revalidated so a
    # deploy shows up immediately.
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Nothing from the repository besides the site itself should ever be reachable.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:sh|py|md|conf)$ { deny all; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    error_page 404 /index.html;
}
